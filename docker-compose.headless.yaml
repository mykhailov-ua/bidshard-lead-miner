# Optional headless lander/tgweb image (Playwright + Chromium).
# Usage:
#   docker compose -f docker-compose.headless.yaml build
#   docker compose -f docker-compose.headless.yaml --profile headless run --rm parser-headless headless drain
#   bash scripts/ops/headless-crawl-cron.sh
#
services:
  parser-headless:
    profiles: ["headless"]
    build:
      context: .
      dockerfile: Dockerfile.playwright
    image: bidshard-parser-headless:local
    network_mode: host
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - parser_runtime:/app/data/runtime
      - ./config:/app/config:ro
    command: ["headless", "drain"]
    deploy:
      resources:
        limits:
          memory: 1536M

volumes:
  parser_runtime:
