# Telethon MTProto sidecar (parser telegram scrape / discover).
#
# Pool is auto-built from data/runtime/discovered_telegram_channels.json (no manual chat list).
# Pipeline: buyer-discover -> triage -> pool_sync -> cron scrape.
#
# Manual work: edit config/discover.icp.json (queries) and pool.denylist only.
#
# Channel roles:
#   buyer_supergroup - buyer communities, HR/recruiting (team OSINT)
#   supply - CPA network official channels (NOT ICP buyers; scrape for team/hiring/buyer voice)
#   vendor_support - hosting/PWA vendor chats (buyer pain only)

discover:
  enabled: true
  icp_path: config/discover.icp.json
  limit_per_query: 10
  serp_channels_path: data/runtime/discovered_telegram_channels.json
  employer_tg_queries_path: data/runtime/discovered_employer_tg_queries.json
  domains_path: data/runtime/discovered_telegram_domains.json
  cross_mention:
    enabled: true
    max_seeds: 60
    messages_per_channel: 50
    rescan_days: 30

pool:
  auto_from_registry: true
  max_active: 120
  denylist:
    - maximaffiliate
    - zuevaff
    - zuevchatcpa
    - traffic_trickster
    - bakalov_info
    - seodroplab
    - po_ushi_v_gambling
    - frbs_team
    - g_gate_media
    - affwriter
    - m2ensenchannel
    - thebuyers_hr
    - hr_nutrinity
    - mia12666
    - igaming_news
    - partnerkin_job
    - pumpspy
    - soltrending
    - hentaigames_yami
    - ltubeoficial
    - sophierainlc
    - anastasiageshev
    - proxymtproto
    - blaze_hr
    - whale_alert_io
    - standleo_exe
    - servandosilva
    - honglian8888
    - laxmikantpolitypdf
    - money
    - kktvinfo
    - spynow

