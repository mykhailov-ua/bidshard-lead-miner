session: data/runtime/telethon.session
cursor_db: data/runtime/crawler.db
poll_delay_sec: 2
message_limit: 500  # max history per scrape pass; fetched in chunks (see TELEGRAM_HISTORY_CHUNK_*)

# In-channel pain search (K-TG-05): iter_messages(search=...) on seed channels.
channel_search:
  enabled: true
  messages_per_term: 20
  # channels: []  # empty = all manual chats[] with username; or list usernames
  terms:
    - postback failing
    - postback timeout
    - voluum alternative
    - keitaro alternative
    - keitaro license
    - tracker migration
    - click id not found
    - self-hosted tracker
    - binom stuck
    - 502 bad gateway
    - nginx upstream

# Optional global pain search (off by default; high FloodWait risk).
# Enable: TELEGRAM_GLOBAL_SEARCH=1, TELEGRAM_GLOBAL_SEARCH_UTC_HOURS=2-6,
# TELEGRAM_GLOBAL_SEARCH_LIMIT=3, TELEGRAM_GLOBAL_SEARCH_DAILY_LIMIT=3
global_search:
  enabled: false
  messages_per_query: 20
  # Narrow technical pain only (no broad "alternative" / "migration" terms).
  terms:
    - postback failing
    - postback timeout
    - click id not found
    - binom stuck
    - 502 bad gateway
    - nginx upstream
    - nginx 502
    - keitaro postback

# Sidecar env (not yaml): TELEGRAM_DISCUSSION_SCRAPE, TELEGRAM_INVITE_JOIN,
# TELEGRAM_REALTIME - see .env.example and docs/OPS.md#telegram-mtproto
