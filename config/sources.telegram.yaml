# Telethon MTProto sidecar (parser telegram scrape / discover).
#
# Pool is auto-built from data/runtime/discovered_telegram_channels.json (no manual chat list).
# Pipeline: buyer-discover -> triage -> pool_sync -> cron scrape.
#
# Manual work: edit config/discover.icp.json (queries) and pool.denylist only.

discover:
  enabled: true
  icp_path: config/discover.icp.json
  limit_per_query: 10
  serp_channels_path: data/runtime/discovered_telegram_channels.json
  employer_tg_queries_path: data/runtime/discovered_employer_tg_queries.json
  domains_path: data/runtime/discovered_telegram_domains.json
  cross_mention:
    enabled: true
    max_seeds: 60
    messages_per_channel: 50
    rescan_days: 30

pool:
  auto_from_registry: true
  max_active: 80
  denylist:
    - maximaffiliate
    - zuevaff
    - zuevchatcpa
    - traffic_trickster
    - bakalov_info
    - seodroplab
    - po_ushi_v_gambling
    - frbs_team
    - g_gate_media
    - affwriter
    - m2ensenchannel
    - thebuyers_hr
    - hr_nutrinity
    - mia12666
    - igaming_news
    - partnerkin_job
    - pumpspy
    - soltrending

# Optional manual overrides (seeds or force-disable). Leave empty for full auto pool.
# H3/H5 examples (enable after invite / public access):
# chats:
#   - name: pwa_group_support
#     username: pwa_group_support
#     geo: global
#     role: vendor_support
#     enabled: false
#   - name: alexhost_clients
#     username: alexhost_clients
#     geo: eu
#     role: vendor_support
#     enabled: false
chats: []

session: data/runtime/telethon.session
cursor_db: data/runtime/crawler.db
poll_delay_sec: 2
message_limit: 500

channel_search:
  enabled: true
  messages_per_term: 20
  terms:
    - postback failing
    - postback timeout
    - voluum alternative
    - voluum pricing
    - redtrack overage
    - binom vs voluum
    - keitaro alternative
    - tracker migration
    - click id not found
    - click loss
    - self-hosted tracker
    - binom stuck
    - 502 bad gateway
    - nginx upstream
    - mysql deadlock

global_search:
  enabled: false
  messages_per_query: 20
  terms:
    - postback failing
    - postback timeout
    - click id not found
    - binom stuck
    - 502 bad gateway
    - nginx upstream
