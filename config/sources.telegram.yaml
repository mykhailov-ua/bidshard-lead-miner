# Telethon MTProto sidecar config (parser telegram / discover / web crawl registry).
#
# Usage:
#   docker compose run --rm -it parser telegram login --qr
#   make tgweb-discover
#   parser telegram scrape  (sidecar reads this yaml)
#
# Paths under data/runtime/ are gitignored; Docker uses parser_runtime named volume.
#
# Manual chats[]: curate EU/LATAM/global channels (geo: ru is dropped at load - never add RU).
# Replace example usernames with real public channels before enabling.
#
discover:
  enabled: true
  icp_path: config/discover.icp.json  # telegram_search + serp dorks (discovery only)
  limit_per_query: 10  # lower than default 15; pair with PARSER_CHANNEL_TRIAGE=true
  serp_channels_path: data/runtime/discovered_telegram_channels.json
  domains_path: data/runtime/discovered_telegram_domains.json  # tgweb crawl registry
  # queries: []  # override; default loads telegram_search from discover.icp.json
  cross_mention:
    enabled: true
    max_seeds: 60
    messages_per_channel: 50
    rescan_days: 30  # skip channels crawled within this window

# Manual additions (public channels only). geo is metadata for ops; loader skips geo: ru.
# Prefer buyer/community chats over news digests. SERP discover fills the rest; triage drops noise.
#
# Intel-only (do not add to chats[]): news digests and job boards - processor rejects as intel_only:
#   igaming_news, partnerkin_job, affiliatechannel_igaming, *_news, *_job*
chats:
  - name: voluum_community
    username: voluum
    geo: global
  # - name: igaming_latam
  #   username: affiliate_latam_en
  #   geo: latam
  # - name: eu_acquisition
  #   username: igaming_acquisition
  #   geo: eu
  # - name: global_stm
  #   username: stmaffiliate
  #   geo: global

session: data/runtime/telethon.session
cursor_db: data/runtime/crawler.db
poll_delay_sec: 2
message_limit: 500

# In-channel pain search (K-TG-05): iter_messages(search=...) on seed channels.
channel_search:
  enabled: true
  messages_per_term: 20
  # channels: []  # empty = all manual chats[] with username; or list usernames
  # terms: []  # default pain terms from scraper config loader

# Optional global pain search (off by default; enable via TELEGRAM_GLOBAL_SEARCH=1)
global_search:
  enabled: false
  messages_per_query: 20
  # terms: []  # default ICP pain phrases from config loader

# Sidecar env (not yaml): TELEGRAM_DISCUSSION_SCRAPE, TELEGRAM_INVITE_JOIN,
# TELEGRAM_REALTIME - see .env.example and docs/OPS.md#telegram-mtproto
