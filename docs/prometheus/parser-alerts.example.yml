# Example Prometheus alert rules for parser metrics (BOX-7).
# Scrape target: PARSER_METRICS_ADDR (default :9465 on VPS profile).
#
# Alert when no leads written in 24h while parser is up:
groups:
  - name: parser
    rules:
      - alert: ParserZeroLeadsWritten24h
        expr: increase(parser_leads_written_total[24h]) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Parser wrote zero leads in 24h
          description: Check proxy, GEMINI_API_KEY, seeds, and crawl logs.

      - alert: ParserFDDriftHigh
        expr: parser_bpf_fd_delta{role="parser"} > 16
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Parser open FD count drifting up during BPF session
          description: Check http.ResponseBody close, proxy pool, and collect-once drain.

      - alert: ParserZeroLeadsAccepted24h
        expr: increase(parser_leads_accepted_total[24h]) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Parser accepted zero leads in 24h
          description: Pipeline may be rejecting everything (geo, ICP, prescan).

      - alert: ParserTasksDropped
        expr: increase(parser_tasks_dropped_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Parser dropped tasks (taskCh full)
          description: Raise PARSER_TASK_BUFFER or PARSER_WORKERS; check soak logs for dropped>0.

      - alert: ParserWarmAnalysisFailed
        expr: increase(parser_warm_analysis_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Warm-path Gemini batch failed after retries
          description: Check GEMINI_API_KEY quota, warm_analysis_dlq collection, and parser logs.

      - alert: ParserLeadsAnalysisPendingHigh
        expr: parser_leads_analysis_pending > 50
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: Many leads stuck in analysis_status=pending
          description: Deferred Gemini backlog; check warm path and GEMINI_API_KEY.

      - alert: ParserLeadsAnalysisPending24h
        expr: parser_leads_analysis_pending > 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: Leads pending deferred analysis for 24h
          description: Warm-path backlog or Gemini outages; check WARM_ANALYSIS_PENDING_SCAN_INTERVAL and GEMINI_API_KEY.

      - alert: ParserWarmAnalysisPendingHigh
        expr: parser_warm_analysis_pending > 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Many leads stuck in analysis_status=pending
          description: Warm-path backlog or Gemini outages; verify WARM_ANALYSIS_PENDING_SCAN_INTERVAL.

      - alert: ParserProxyBudgetExceeded
        expr: parser_proxy_budget_exceeded == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Daily proxy egress cap reached
          description: CF proxy sources skipped until UTC midnight; raise PARSER_PROXY_DAILY_MB_CAP or wait for reset.
